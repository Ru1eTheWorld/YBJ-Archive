<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ru1eTheWorld · 3D 홀로그램 포토카드</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  :root{
    --gold:#d8b56a;
    --gold-soft:rgba(216,181,106,.42);
    --card-w:min(80vw, 41vh, 320px);
    --radius:14px;
    --ink:#f3ece0;
    --ink-dim:rgba(243,236,224,.62);
    --bg:#08070a;
    --glass:rgba(255,255,255,.06);
    --glass-line:rgba(255,255,255,.13);
    --chip-on:#f6e8c6;
    --shadow:rgba(0,0,0,.72);
  }
  @supports (height:100svh){ :root{ --card-w:min(80vw, 41svh, 320px); } }
  @media (min-width:820px){ :root{ --card-w:min(420px, 40svh); } }

  html[data-theme="light"]{
    --ink:#241f19;
    --ink-dim:rgba(36,31,25,.60);
    --bg:#f4eee4;
    --glass:rgba(255,255,255,.55);
    --glass-line:rgba(60,44,20,.16);
    --gold:#a8813a;
    --gold-soft:rgba(168,129,58,.35);
    --chip-on:#2a2216;
    --shadow:rgba(78,58,26,.30);
  }

  body{
    margin:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    flex-direction:column;
    transition:background .5s ease,color .5s ease;
  }
  @supports (height:100svh){ body{height:100svh} }

  /* ── room light ─────────────────────────────── */
  .room{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .room::before,.room::after{content:"";position:absolute;border-radius:50%;filter:blur(60px)}
  .room::before{
    width:120vw;height:70vh;left:-10vw;top:-28vh;
    background:radial-gradient(closest-side, rgba(216,181,106,.30), rgba(216,181,106,0) 72%);
    opacity:.85;
  }
  .room::after{
    width:110vw;height:64vh;right:-30vw;bottom:-24vh;
    background:radial-gradient(closest-side, rgba(120,92,255,.28), rgba(120,92,255,0) 70%);
  }
  .room .veil{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(100% 90% at 50% 120%, rgba(0,0,0,.55), transparent 60%);
  }
  html[data-theme="light"] .room::before{background:radial-gradient(closest-side, rgba(216,181,106,.55), rgba(216,181,106,0) 72%)}
  html[data-theme="light"] .room::after{background:radial-gradient(closest-side, rgba(160,140,255,.35), rgba(160,140,255,0) 70%)}
  html[data-theme="light"] .room .veil{background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(100% 90% at 50% 120%, rgba(120,92,45,.18), transparent 60%)}

  /* ── top bar ────────────────────────────────── */
  .topbar{
    position:relative;z-index:3;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(8px + env(safe-area-inset-top)) 16px 4px;
    flex:0 0 auto;
  }
  .brand{display:flex;align-items:baseline;gap:7px;letter-spacing:.16em;font-size:11px;text-transform:uppercase}
  .brand .mark{
    font-family:"Didot","Bodoni 72","Times New Roman",serif;
    font-size:15px;letter-spacing:0;color:var(--gold);
    border:1px solid var(--gold-soft);border-radius:50%;
    width:22px;height:22px;display:grid;place-items:center;
    transform:translateY(2px);
  }
  .brand b{font-weight:600;color:var(--ink)}
  .brand em{font-style:normal;color:var(--ink-dim);font-size:9px;letter-spacing:.22em}
  .top-actions{display:flex;gap:6px}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;font-size:14px;
    background:var(--glass);border:1px solid var(--glass-line);color:var(--ink);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    cursor:pointer;touch-action:manipulation;transition:transform .2s,background .3s;
  }
  .icon-btn:active{transform:scale(.92)}

  /* ── stage ──────────────────────────────────── */
  .stage-wrap{
    position:relative;z-index:2;flex:1 1 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;min-height:0;padding:2px 0 0;
  }
  .stage{
    position:relative;
    width:var(--card-w);
    height:calc(var(--card-w) * 1.5);
    perspective:1150px;
    perspective-origin:50% 46%;
    touch-action:none;
    cursor:grab;
  }
  .stage:active{cursor:grabbing}

  .pedestal{
    position:absolute;left:50%;bottom:-6%;
    width:88%;height:16%;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, var(--shadow), transparent 78%);
    filter:blur(10px);
    z-index:0;
  }

  .tilt{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .flipper{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .88s cubic-bezier(.2,.86,.22,1);
    will-change:transform;
  }
  .flipper.is-flipped{transform:rotateY(180deg)}

  .face{
    position:absolute;inset:0;
    border-radius:var(--radius);
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform-style:flat;
    -webkit-user-select:none;user-select:none;
    background:#0b0a0e;
    box-shadow:
      0 1px 0 rgba(255,255,255,.16) inset,
      0 0 0 1px rgba(0,0,0,.55),
      0 26px 50px -18px rgba(0,0,0,.85);
  }
  .face.back{transform:rotateY(180deg)}

  .ph{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    -webkit-user-select:none;user-select:none;
    -webkit-user-drag:none;
  }
  .front .ph{object-position:44% 32%}
  .back .ph{
    height:58%;object-position:50% 50%;
    -webkit-mask-image:linear-gradient(#000 82%, rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(#000 82%, rgba(0,0,0,0) 100%);
  }
  .shade{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 58%, rgba(0,0,0,.72) 100%);
    pointer-events:none;
  }
  .back .shade{
    background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 42%);
  }

  /* ── holographic foil ───────────────────────── */
  .foil{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:2}
  .h{
    position:absolute;inset:-46%;
    opacity:0;
    transition:opacity .5s ease;
    will-change:transform,opacity;
    transform:translate3d(calc(var(--nx,0) * -26px), calc(var(--ny,0) * -26px),0) scale(1.25);
  }

  /* prism */
  .h-prism{
    background:
      radial-gradient(closest-side at 46% 38%, rgba(255,255,255,.35), transparent 70%),
      repeating-linear-gradient(62deg,
        rgba(255,74,128,.62) 0 9px,
        rgba(255,206,92,.66) 9px 18px,
        rgba(150,255,146,.60) 18px 27px,
        rgba(86,216,255,.66) 27px 36px,
        rgba(150,116,255,.62) 36px 45px,
        rgba(255,110,198,.60) 45px 54px,
        rgba(255,74,128,.62) 54px 63px);
    filter:blur(2.6px) saturate(1.25);
    mix-blend-mode:color-dodge;
    -webkit-mask-image:linear-gradient(116deg, transparent 6%, #000 28%, #000 60%, rgba(0,0,0,.25) 78%, transparent 92%);
    mask-image:linear-gradient(116deg, transparent 6%, #000 28%, #000 60%, rgba(0,0,0,.25) 78%, transparent 92%);
  }
  /* plain — 원본 사진 모드: 홀로그램 레이어를 모두 숨김 */
  [data-pattern="plain"] .h-prism,
  [data-pattern="plain"] .h-aurora,
  [data-pattern="plain"] .spec,
  [data-pattern="plain"] .streak{opacity:0;animation:none;transition:opacity .35s ease}
  /* aurora */
  .h-aurora{
    background:
      radial-gradient(42% 52% at 22% 28%, rgba(0,255,208,.72), transparent 72%),
      radial-gradient(46% 46% at 76% 22%, rgba(122,92,255,.72), transparent 74%),
      radial-gradient(52% 50% at 58% 82%, rgba(255,92,182,.62), transparent 72%),
      radial-gradient(40% 40% at 20% 88%, rgba(92,180,255,.55), transparent 74%);
    filter:blur(16px) saturate(1.35);
    mix-blend-mode:screen;
  }
  [data-pattern="aurora"] .h-aurora{animation:drift 14s ease-in-out infinite alternate}
  [data-pattern="prism"] .h-prism{opacity:.46}
  [data-pattern="aurora"] .h-aurora{opacity:.58}

  html[data-theme="light"] .h-prism{mix-blend-mode:overlay;opacity:0;filter:blur(3px) saturate(1.5)}
  html[data-theme="light"] [data-pattern="prism"] .h-prism{opacity:.75}

  /* specular + streak */
  .spec{
    position:absolute;inset:-28%;z-index:3;pointer-events:none;
    background:radial-gradient(closest-side at 50% 44%, rgba(255,255,255,.50), rgba(255,255,255,.10) 46%, transparent 72%);
    mix-blend-mode:soft-light;
    opacity:calc(.18 + var(--m,0) * .42);
    transform:translate3d(calc(var(--nx,0) * -46px), calc(var(--ny,0) * -46px),0);
    will-change:transform,opacity;
  }
  .streak{
    position:absolute;inset:-20%;z-index:3;pointer-events:none;
    background:linear-gradient(104deg, transparent 34%, rgba(255,255,255,.22) 46%, rgba(255,255,255,.04) 53%, transparent 64%);
    mix-blend-mode:screen;
    opacity:calc(.12 + var(--m,0) * .42);
    transform:translate3d(calc(var(--nx,0) * -30px), calc(var(--ny,0) * -18px),0);
  }
  .grain{
    position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:120px 120px;
  }
  .edge{
    position:absolute;inset:7px;z-index:5;border-radius:9px;pointer-events:none;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 0 0 1px rgba(216,181,106,.16);
  }
  html[data-theme="light"] .edge{border-color:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(120,88,36,.22)}

  /* front labels */
  .f-label{
    position:absolute;left:13px;right:13px;bottom:11px;z-index:6;
    display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
    color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.65);
  }
  .f-label b{display:block;font-size:9px;font-weight:600;letter-spacing:.26em;opacity:.94}
  .f-label span{display:block;font-size:7.5px;letter-spacing:.14em;opacity:.72;margin-top:3px}
  .f-label .wm{
    font-family:"Didot","Bodoni 72","Times New Roman",serif;
    font-size:8px;letter-spacing:.2em;opacity:.8;white-space:nowrap;
    margin-left:auto;
  }
  /* 빈 값이면 요소를 완전히 숨김 */
  .f-label .off{display:none!important}

  /* back panel */
  .b-panel{
    position:absolute;left:0;right:0;bottom:0;height:42%;z-index:6;
    padding:10px 14px 12px;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(10,9,13,.0) 0%, rgba(10,9,13,.92) 26%, #0a090d 100%);
    color:#f3ece0;
  }
  html[data-theme="light"] .b-panel{
    background:linear-gradient(180deg, rgba(250,246,238,0), rgba(250,246,238,.94) 26%, #faf6ee 100%);
    color:#241f19;
  }
  .b-brand{
    font-size:7.5px;letter-spacing:.34em;color:var(--gold);
    display:flex;align-items:center;gap:6px;margin-bottom:5px;
  }
  .b-brand::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent)}
  .b-title{
    font-family:"Didot","Bodoni 72","Times New Roman",Georgia,serif;
    font-size:11.5px;line-height:1.28;letter-spacing:.06em;
    font-weight:500;margin:0 0 4px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .b-meta{
    font-size:9px;letter-spacing:.06em;opacity:.72;margin-bottom:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .b-memo{
    font-size:9.5px;line-height:1.45;opacity:.9;
    font-style:italic;font-family:"Times New Roman",Georgia,serif;
    letter-spacing:.02em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    border-left:1px solid var(--gold-soft);padding-left:7px;margin:2px 0 6px;
  }
  .b-foot{
    display:flex;justify-content:space-between;align-items:center;
    font-size:7px;letter-spacing:.2em;opacity:.5;
  }

  /* ── hint ───────────────────────────────────── */
  .hint{
    margin:0;font-size:10.5px;letter-spacing:.06em;color:var(--ink-dim);
    text-align:center;padding:0 18px;min-height:14px;
    transition:opacity .4s;
  }

  /* ── tray ───────────────────────────────────── */
  .tray{
    position:relative;z-index:3;flex:0 0 auto;
    padding:6px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .chips{display:flex;gap:6px;width:100%;max-width:360px}
  .chip{
    flex:1;padding:8px 4px;border-radius:999px;
    font-size:11px;letter-spacing:.02em;font-family:inherit;
    color:var(--ink-dim);background:var(--glass);
    border:1px solid var(--glass-line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    cursor:pointer;touch-action:manipulation;
    transition:all .25s ease;
  }
  .chip.on{
    color:var(--chip-on);border-color:var(--gold-soft);
    background:linear-gradient(180deg, rgba(216,181,106,.26), rgba(216,181,106,.10));
    box-shadow:0 0 14px -2px rgba(216,181,106,.45);
  }
  html[data-theme="light"] .chip.on{color:#fff;background:linear-gradient(180deg,#6b5227,#43301a);border-color:#8a6a2f}
  .actions{display:flex;gap:6px;width:100%;max-width:360px}
  .pill{
    flex:1;padding:11px 6px;border-radius:999px;
    font-size:12px;font-family:inherit;letter-spacing:.01em;
    color:var(--ink);background:var(--glass);
    border:1px solid var(--glass-line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    cursor:pointer;touch-action:manipulation;
    display:flex;align-items:center;justify-content:center;gap:4px;
    transition:transform .18s,background .25s,color .25s;
    white-space:nowrap;
  }
  .pill:active{transform:scale(.96)}
  .pill.primary{
    color:#14100a;border-color:transparent;
    background:linear-gradient(180deg,#f2dcae,#c8a259);
    font-weight:600;
    box-shadow:0 6px 18px -8px rgba(216,181,106,.9);
  }
  html[data-theme="light"] .pill.primary{color:#fff;background:linear-gradient(180deg,#7a5c2a,#4a351a)}
  .pill.on{
    color:#14100a;border-color:transparent;
    background:linear-gradient(180deg,#e9f7ff,#a9d9ff);
    font-weight:600;
  }

  /* ── toast ──────────────────────────────────── */
  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px);
    padding:9px 16px;border-radius:999px;
    font-size:11.5px;letter-spacing:.02em;
    background:rgba(20,18,24,.92);color:#f3ece0;
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;z-index:40;
    transition:opacity .3s,transform .3s;
    max-width:84vw;white-space:normal;text-align:center;line-height:1.35;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ── editor sheet ───────────────────────────── */
  .sheet{position:fixed;inset:0;z-index:50;visibility:hidden;pointer-events:none;transition:visibility 0s linear .42s}
  .sheet.open{visibility:visible;pointer-events:auto;transition-delay:0s}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
  .sheet.open .sheet-bg{opacity:1}
  .sheet-panel{
    position:absolute;left:0;right:0;bottom:0;
    max-height:82svh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:linear-gradient(180deg,#141119,#0c0a10);
    border-top:1px solid rgba(255,255,255,.12);
    border-radius:20px 20px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.2,1);
    color:#f3ece0;
    box-shadow:0 -20px 50px rgba(0,0,0,.6);
  }
  .sheet.open .sheet-panel{transform:translateY(0)}
  html[data-theme="light"] .sheet-panel{background:linear-gradient(180deg,#fffaf1,#f2ead9);color:#241f19;border-top-color:rgba(120,88,36,.25)}
  .grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 12px}
  html[data-theme="light"] .grab{background:rgba(80,60,30,.25)}
  .sheet h2{margin:0 0 12px;font-size:14px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .sheet h2 small{font-weight:400;font-size:10.5px;color:var(--ink-dim);letter-spacing:0}
  .files{display:flex;gap:8px;margin-bottom:12px}
  .file{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 8px;border-radius:12px;cursor:pointer;
    font-size:12px;text-align:center;
    border:1px dashed rgba(255,255,255,.22);
    background:rgba(255,255,255,.04);
    transition:background .2s;
  }
  .file:active{background:rgba(255,255,255,.1)}
  html[data-theme="light"] .file{border-color:rgba(120,88,36,.35);background:rgba(120,88,36,.05);color:#241f19}
  .file input{display:none}
  .field{display:block;margin-bottom:10px}
  .field span{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:5px}
  .field input{
    width:100%;padding:11px 12px;border-radius:11px;
    font-size:16px;font-family:inherit;color:inherit;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    outline:none;transition:border-color .2s,background .2s;
  }
  html[data-theme="light"] .field input{background:#fff;border-color:rgba(120,88,36,.25)}
  .field input:focus{border-color:var(--gold-soft);background:rgba(255,255,255,.1)}
  .fgroup{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1)}
  html[data-theme="light"] .fgroup{border-top-color:rgba(120,88,36,.18)}
  .fgroup-t{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
  .fgroup-t small{font-weight:400;font-size:10px;color:var(--ink-dim);letter-spacing:0}
  .sheet-actions{display:flex;gap:8px;margin-top:14px}
  .sheet-actions .pill{padding:13px 8px;font-size:12.5px}
  .pill.ghost{flex:0 0 40%;background:transparent;border-color:rgba(255,255,255,.16)}
  html[data-theme="light"] .pill.ghost{border-color:rgba(120,88,36,.3)}

  @keyframes drift{
    0%{transform:translate3d(calc(var(--nx,0) * -26px), calc(var(--ny,0) * -26px),0) scale(1.2) rotate(0deg)}
    100%{transform:translate3d(calc(var(--nx,0) * -26px + 12px), calc(var(--ny,0) * -26px - 10px),0) scale(1.32) rotate(6deg)}
  }
  @media (prefers-reduced-motion:reduce){
    .h-aurora{animation:none}
  }
  /* 가로로 눕혔을 때 */
  @media (orientation:landscape) and (max-height:520px){
    :root{--card-w:min(41vh, 220px)}
    .topbar{padding-top:calc(6px + env(safe-area-inset-top))}
    .hint{display:none}
    .tray{padding-bottom:calc(8px + env(safe-area-inset-bottom));gap:6px}
    .chip{padding:6px 4px;font-size:10px}
    .pill{padding:9px 6px;font-size:11px}
    .stage-wrap{gap:4px}
  }
</style>
</head>
<body>
<div class="room" aria-hidden="true"><div class="veil"></div></div>

<header class="topbar">
  <div class="brand">
    <span class="mark">R</span>
    <b>RU1ETHEWORLD</b>
    <em>PHOCA</em>

<script>
(function(){
  "use strict";

  var KEY = "ru1e-phoca-v2";
  var DEFAULTS = {
    title: "2025-26 임재범 40주년콘서트 '나는 임재범이다'",
    meta: "2026.03.28 · 창원",
    memo: "포텐 터진 날",
    fTitle: "YIM JAE BEUM",
    fSub: "40TH ANNIVERSARY",
    fWm: "Ru1eTheWorld",
    pattern: "prism",
    theme: "dark",
    front: null,
    back: null
  };

  /* 앞면 라벨은 빈 문자열도 "지움"이라는 뜻이므로 그대로 저장/복원한다 */
  var EMPTY_OK = { fTitle: 1, fSub: 1, fWm: 1 };

  var $ = function(sel, root){ return (root || document).querySelector(sel); };
  var $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var clamp = function(v, a, b){ return v < a ? a : (v > b ? b : v); };

  var stage = $("#stage");
  var tiltEl = $("#tilt");
  var flipper = $("#flipper");
  var frontImg = $("#frontImg");
  var backImg = $("#backImg");
  var bTitle = $("#bTitle");
  var bMeta = $("#bMeta");
  var bMemo = $("#bMemo");
  var hint = $("#hint");
  var toastEl = $("#toast");
  var sheet = $("#sheet");
  var elFTitle = $("#fTitle");
  var elFSub = $("#fSub");
  var elFWm = $("#fWm");

  var srcFrontDefault = frontImg.getAttribute("src");
  var srcBackDefault = backImg.getAttribute("src");

  var store = {};
  for (var k in DEFAULTS){ if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) store[k] = DEFAULTS[k]; }

  /* ---------- storage ---------- */
  function loadStore(){
    try{
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && typeof o === "object"){
        for (var p in DEFAULTS){
          if (!Object.prototype.hasOwnProperty.call(o, p)) continue;
          if (o[p] === null || o[p] === undefined) continue;
          if (o[p] === "" && !EMPTY_OK[p]) continue;
          store[p] = o[p];
        }
      }
    }catch(e){ /* 저장된 값이 없거나 깨졌으면 기본값으로 */ }
  }
  function saveStore(){
    try{
      localStorage.setItem(KEY, JSON.stringify(store));
    }catch(e){
      toast("이 브라우저에는 저장이 안 돼요. 지금 보이는 대로만 쓸 수 있어요.");
    }
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2100);
  }

  /* ---------- theme ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    $("#themeBtn").textContent = (t === "dark") ? "☀️" : "🌙";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", (t === "dark") ? "#08070a" : "#f4eee4");
  }

  /* ---------- pattern ---------- */
  /* 예전 '글리터' 모드는 '원본 사진' 모드로 이어진다 */
  var PATTERN_ALIAS = { glitter: "plain" };
  var PATTERNS = { prism: 1, plain: 1, aurora: 1 };
  function normalizePattern(p){
    var v = PATTERN_ALIAS[p] || p;
    return PATTERNS[v] ? v : "plain";
  }
  function applyPattern(p){
    p = normalizePattern(p);
    flipper.setAttribute("data-pattern", p);
    store.pattern = p;
    $$(".chip").forEach(function(c){
      c.classList.toggle("on", c.getAttribute("data-pattern") === p);
    });
  }

  /* ---------- text ---------- */
  function setLabel(el, val){
    if (!el) return;
    var v = (val === null || val === undefined) ? "" : String(val);
    el.textContent = v;
    if (v.trim() === "") el.classList.add("off");
    else el.classList.remove("off");
  }
  function applyText(){
    bTitle.textContent = store.title;
    bMeta.textContent = store.meta;
    bMemo.textContent = store.memo;
    setLabel(elFTitle, store.fTitle);
    setLabel(elFSub, store.fSub);
    setLabel(elFWm, store.fWm);
  }
  function applyImages(){
    frontImg.src = store.front || srcFrontDefault;
    backImg.src = store.back || srcBackDefault;
  }

  /* ---------- 3D tilt engine ---------- */
  var MAX = 20;              // 최대 기울기(도)
  var rx = 0, ry = 0, vrx = 0, vry = 0;   // 현재값 / 속도
  var trx = 0, tryT = 0;                   // 목표값
  var hoverMode = false, dragging = false, gyroOn = false, idleUntil = 0;
  var flipped = false;

  try{ hoverMode = window.matchMedia("(hover:hover) and (pointer:fine)").matches; }catch(e){ hoverMode = false; }

  var HINT_IDLE = hoverMode ? "마우스를 올려 보세요 · 클릭하면 뒤집혀요" : "손가락으로 기울여 보세요 · 톡 누르면 뒤집혀요";
  var HINT_BACK = hoverMode ? "다시 클릭하면 앞면으로 돌아와요" : "톡 누르면 앞면으로 돌아와요";

  var startX = 0, startY = 0, startT = 0, moved = 0, pid = null;

  function setTarget(nx, ny){
    trx = clamp(ny, -1, 1) * MAX;
    tryT = clamp(nx, -1, 1) * -MAX;
    idleUntil = performance.now() + 2600;
  }

  function resetTarget(){
    trx = 0; tryT = 0;
    idleUntil = performance.now() + 1200;
  }

  stage.addEventListener("pointerdown", function(e){
    dragging = true;
    pid = e.pointerId;
    moved = 0;
    startX = e.clientX; startY = e.clientY; startT = Date.now();
    try{ stage.setPointerCapture(pid); }catch(err){}
  });

  stage.addEventListener("pointermove", function(e){
    if (gyroOn) return;
    var r = stage.getBoundingClientRect();
    var nx = ((e.clientX - r.left) / r.width - .5) * 2;
    var ny = ((e.clientY - r.top) / r.height - .5) * 2;

    if (dragging){
      moved = Math.max(moved, Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY));
      setTarget(clamp(nx * 1.35, -1, 1), clamp(ny * 1.35, -1, 1));
    } else if (hoverMode){
      setTarget(clamp(nx * .8, -1, 1), clamp(ny * .8, -1, 1));
    }
  });

  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    try{ if (pid !== null) stage.releasePointerCapture(pid); }catch(err){}
    pid = null;
    var dt = Date.now() - startT;
    if (moved < 12 && dt < 600) flip();
    else resetTarget();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("pointerleave", function(){
    if (!dragging && hoverMode && !gyroOn) resetTarget();
  });

  /* ---------- gyroscope tilt ---------- */
  var betaBase = null, gammaBase = null;

  function onOrient(e){
    if (e.beta === null && e.gamma === null) return;
    var beta = e.beta || 0;
    var gamma = e.gamma || 0;
    if (betaBase === null){ betaBase = beta; gammaBase = gamma; return; }
    var dBeta = beta - betaBase;
    var dGamma = gamma - gammaBase;
    trx = clamp(dBeta * 0.42, -MAX, MAX);
    tryT = clamp(dGamma * 0.55, -MAX, MAX);
    idleUntil = performance.now() + 1500;
  }

  function startGyro(){
    function listen(){
      window.addEventListener("deviceorientation", onOrient, true);
      gyroOn = true;
      betaBase = null; gammaBase = null;
      $("#gyroBtn").classList.add("on");
      $("#gyroBtn").textContent = "📱 기울기 ON";
      hint.textContent = "폰을 이리저리 기울여 보세요 ✨";
      toast("폰 기울기로 반짝여요");
    }

    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      DeviceOrientationEvent.requestPermission().then(function(res){
        if (res === "granted") listen();
        else toast("움직임 접근을 허용해야 기울기를 쓸 수 있어요");
      }).catch(function(){ toast("움직임 접근을 허용해야 기울기를 쓸 수 있어요"); });
    } else if (typeof DeviceOrientationEvent !== "undefined"){
      listen();
    } else {
      toast("이 기기에서는 기울기를 못 읽어요");
    }
  }

  function stopGyro(){
    window.removeEventListener("deviceorientation", onOrient, true);
    gyroOn = false;
    $("#gyroBtn").classList.remove("on");
    $("#gyroBtn").textContent = "📱 기울기";
    hint.textContent = HINT_IDLE;
    resetTarget();
  }

  $("#gyroBtn").addEventListener("click", function(){
    if (gyroOn) stopGyro();
    else startGyro();
  });

  /* ---------- flip ---------- */
  function flip(){
    flipped = !flipped;
    flipper.classList.toggle("is-flipped", flipped);
    hint.textContent = flipped ? HINT_BACK : HINT_IDLE;
    resetTarget();
  }
  $("#flipBtn").addEventListener("click", flip);

  /* ---------- animation loop ---------- */
  var lastT = performance.now();
  function frame(t){
    var dt = clamp((t - lastT) / 16.7, .4, 2.4);
    lastT = t;

    var tx = trx, ty = tryT;
    if (!dragging && !gyroOn && t > idleUntil){
      var s = t / 1000;
      tx += Math.sin(s * .74) * 1.9;
      ty += Math.cos(s * .57) * 2.6;
    }

    var k = 0.16, damp = Math.pow(0.80, dt);
    vrx = (vrx + (tx - rx) * k * dt) * damp;
    vry = (vry + (ty - ry) * k * dt) * damp;
    rx += vrx * dt;
    ry += vry * dt;

    tiltEl.style.transform = "rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";

    var nx = clamp(ry / MAX, -1, 1);
    var ny = clamp(rx / MAX, -1, 1);
    var m = Math.min(1, Math.sqrt(nx * nx + ny * ny));
    var vs = tiltEl.style;
    vs.setProperty("--nx", nx.toFixed(3));
    vs.setProperty("--ny", ny.toFixed(3));
    vs.setProperty("--m", m.toFixed(3));

    requestAnimationFrame(frame);
  }

  /* ---------- image handling ---------- */
  function fileToDataURL(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var MAXPX = 1000;
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAXPX / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var cv = document.createElement("canvas");
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var out;
        try{ out = cv.toDataURL("image/jpeg", 0.82); }
        catch(err){ out = reader.result; }
        cb(out);
      };
      img.onerror = function(){ cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  $("#frontInput").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    toast("앞면 사진 넣는 중…");
    fileToDataURL(f, function(url){
      if (!url){ toast("사진을 읽지 못했어요. 다른 사진으로 해 보세요."); return; }
      store.front = url;
      frontImg.src = url;
      saveStore();
      toast("앞면 사진을 바꿨어요 ✨");
      try{ if (flipped) flip(); }catch(err){}
    });
    e.target.value = "";
  });

  $("#backInput").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    toast("뒷면 사진 넣는 중…");
    fileToDataURL(f, function(url){
      if (!url){ toast("사진을 읽지 못했어요. 다른 사진으로 해 보세요."); return; }
      store.back = url;
      backImg.src = url;
      saveStore();
      toast("뒷면 사진을 바꿨어요 ✨");
    });
    e.target.value = "";
  });

  /* ---------- editor sheet ---------- */
  var inTitle = $("#inTitle"), inMeta = $("#inMeta"), inMemo = $("#inMemo");
  var inFTitle = $("#inFTitle"), inFSub = $("#inFSub"), inFWm = $("#inFWm");
  var saveTimer = null;

  function openSheet(){
    inTitle.value = store.title;
    inMeta.value = store.meta;
    inMemo.value = store.memo;
    inFTitle.value = store.fTitle;
    inFSub.value = store.fSub;
    inFWm.value = store.fWm;
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
  }
  function closeSheet(){
    if (sheet.classList.contains("open")) saveText();
    sheet.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
  }

  $("#editBtn").addEventListener("click", openSheet);
  $("#editBtn2").addEventListener("click", openSheet);
  $("#sheetBg").addEventListener("click", closeSheet);
  $("#doneBtn").addEventListener("click", function(){ saveText(); closeSheet(); toast("저장했어요 ✨"); });

  function saveText(){
    store.title = inTitle.value.trim() || DEFAULTS.title;
    store.meta = inMeta.value.trim() || DEFAULTS.meta;
    store.memo = inMemo.value.trim() || DEFAULTS.memo;
    store.fTitle = inFTitle.value.trim();
    store.fSub = inFSub.value.trim();
    store.fWm = inFWm.value.trim();
    applyText();
    saveStore();
  }

  function queueSave(){
    applyTextPreview();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveText, 700);
  }
  function applyTextPreview(){
    bTitle.textContent = inTitle.value.trim() || DEFAULTS.title;
    bMeta.textContent = inMeta.value.trim() || DEFAULTS.meta;
    bMemo.textContent = inMemo.value.trim() || DEFAULTS.memo;
    setLabel(elFTitle, inFTitle.value);
    setLabel(elFSub, inFSub.value);
    setLabel(elFWm, inFWm.value);
  }
  inTitle.addEventListener("input", queueSave);
  inMeta.addEventListener("input", queueSave);
  inMemo.addEventListener("input", queueSave);
  inFTitle.addEventListener("input", queueSave);
  inFSub.addEventListener("input", queueSave);
  inFWm.addEventListener("input", queueSave);

  $("#resetBtn").addEventListener("click", function(){
    for (var p in DEFAULTS){
      if (Object.prototype.hasOwnProperty.call(DEFAULTS, p)) store[p] = DEFAULTS[p];
    }
    try{ localStorage.removeItem(KEY); }catch(e){}
    applyImages();
    applyText();
    applyPattern(store.pattern);
    applyTheme(store.theme);
    if (flipped) flip();
    inTitle.value = store.title;
    inMeta.value = store.meta;
    inMemo.value = store.memo;
    inFTitle.value = store.fTitle;
    inFSub.value = store.fSub;
    inFWm.value = store.fWm;
    toast("처음 상태로 돌아갔어요");
  });

  /* ---------- theme toggle ---------- */
  $("#themeBtn").addEventListener("click", function(){
    store.theme = (document.documentElement.getAttribute("data-theme") === "dark") ? "light" : "dark";
    applyTheme(store.theme);
    saveStore();
  });

  /* ---------- pattern buttons ---------- */
  $$(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      applyPattern(c.getAttribute("data-pattern"));
      saveStore();
    });
  });

  /* ---------- boot ---------- */
  loadStore();
  applyTheme(store.theme);
  applyPattern(store.pattern);
  applyText();
  applyImages();
  hint.textContent = HINT_IDLE;
  requestAnimationFrame(frame);

  window.addEventListener("orientationchange", function(){ resetTarget(); });
  window.addEventListener("resize", function(){ resetTarget(); });
})();
</script>
</body>
</html>
